name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions — no write access required for tests.
# Each job may tighten further; no job may widen beyond this.
permissions:
  contents: read

# Cancel any in-progress run for the same ref when a new one is triggered.
# Keeps PRs from queuing up multiple runs on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint src/
      - name: Run tests
        run: bun run test
