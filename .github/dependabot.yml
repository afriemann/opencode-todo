version: 2
updates:
  # Keep GitHub Actions pinned to current SHAs automatically.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # No `bun` package-ecosystem entry: GitHub's Dependabot bun updater only
  # parses bun.lock `lockfileVersion: 1`, but this project's installed Bun
  # writes `lockfileVersion: 2` — every run fails with
  # "Unsupported bun.lock 'lockfileVersion' 2 ... supports up to 1."
  # Re-add once Dependabot's bun updater supports the current lockfile format.
